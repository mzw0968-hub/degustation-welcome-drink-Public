<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · Dégustation Welcome Drink</title>
<meta name="robots" content="noindex">
<style>
  @font-face{font-family:Pretendard;font-weight:400;src:url(https://degustation-invitation.vercel.app/fonts/Pretendard-Regular.woff2) format("woff2")}
  @font-face{font-family:Pretendard;font-weight:500;src:url(https://degustation-invitation.vercel.app/fonts/Pretendard-Medium.woff2) format("woff2")}
  @font-face{font-family:Literata;font-weight:400;src:url(https://degustation-invitation.vercel.app/fonts/Literata-Regular.woff2) format("woff2")}
  @font-face{font-family:CherieDEMO;src:url(https://degustation-invitation.vercel.app/fonts/CherieDEMO.woff2) format("woff2")}
  @font-face{font-family:JuliaMono;font-weight:300;src:url(https://degustation-invitation.vercel.app/fonts/JuliaMono-Light.woff2) format("woff2")}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#f4ede2;--ink:#5b180a;--muted:rgba(91,24,10,.6);--line:rgba(91,24,10,.18);--card:#fbf7f0;--accent:#842310;--ok:#4f6b3a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button,input{font:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  header .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:600;text-transform:uppercase}
  header h1{margin:4px 0 0;font:400 34px/1 CherieDEMO,Literata,serif;letter-spacing:-.01em}
  .upd{font-size:12px;color:var(--muted)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:#bbb}
  .btn.dark{background:#842310;color:#fff2df;border-color:#842310}
  .btn.sm{padding:6px 10px;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .stat .k{font-size:13px;color:var(--muted)}
  .stat .v{font:400 36px CherieDEMO,Literata,serif;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:500}
  .stat.hl{background:#842310;color:#fff2df;border-color:#842310} .stat.hl .k{color:rgba(255,255,255,.65)}
  .progress{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
  .progress i{display:block;height:100%;background:#b8705a}
  .grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel h3{margin:0 0 14px;font-size:15px}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
  .toolbar input:focus{border-color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:var(--card);padding:9px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:#842310;color:#fff2df}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
  td{padding:11px 8px;border-bottom:1px solid #f0efeb;vertical-align:middle}
  td.no{font-family:JuliaMono,monospace;font-weight:300;font-variant-numeric:tabular-nums;width:56px}
  td.t{color:var(--muted);font-size:13px;white-space:nowrap}
  tr.got td{color:#9a978f} tr.got td.no{color:#9a978f}
  .chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);white-space:nowrap}
  .chk.on{background:#e7f3ec;border-color:#c6e3d1;color:var(--ok)}
  .del{border:0;background:none;color:#b3afa6;cursor:pointer;font-size:13px;padding:5px}
  .del.confirm{color:#fff;background:var(--accent);border-radius:8px;padding:5px 9px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .field{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .field label{font-size:14px}
  .field input[type=number]{width:96px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:right}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:.2s}
  .switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--ok)}
  .switch input:checked+span:before{transform:translateX(20px)}
  .url{font-size:12px;word-break:break-all;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin:0 0 10px}
  #qr{display:flex;justify-content:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px}
  #qr img,#qr canvas{width:180px!important;height:180px!important}
  .gstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .gs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .gs .top{display:flex;justify-content:space-between;font-size:13px}
  .gs .top b{font-size:14px}
  .gs .top span{color:var(--muted);font-variant-numeric:tabular-nums}
  .gs .progress{margin-top:8px}
  .gs.full .progress i{background:var(--ok)}
  .grow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .grow input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}
  .grow .gn{flex:1}
  .grow .gc{width:72px;text-align:right}
  .grow .x{border:0;background:none;color:#b3afa6;cursor:pointer;font-size:18px;padding:2px 6px}
  .gtag{display:inline-block;font-size:12px;font-weight:600;background:var(--bg);border-radius:6px;padding:3px 7px;white-space:nowrap}
  select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .side>.panel+.panel{margin-top:16px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;
    border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  /* login */
  .login{max-width:340px;margin:16vh auto 0;padding:0 20px}
  .login h1{font-size:24px;margin:6px 0 20px}
  .login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:10px;outline:none}
  .login .btn{width:100%;padding:14px;font-size:16px}
  .login .err{color:var(--accent);font-size:14px;min-height:1.2em;margin-top:8px}
  .hidden{display:none!important}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr} .side{order:-1}
    .stats{grid-template-columns:repeat(2,1fr)}
    td.t.reg, th.reg{display:none}
  }
</style>
</head>
<body>

<div id="loginView" class="login">
  <div class="upd">ADMIN</div>
  <h1>웰컴 드링크 관리자</h1>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button class="btn dark" type="submit" id="loginBtn">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div>
      <div class="eyebrow">Welcome Drink · Admin</div>
      <h1 id="title">Dégustation</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="upd" id="upd"></span>
      <button class="btn sm" id="refreshBtn">새로고침</button>
      <button class="btn sm" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat hl"><div class="k">사전 등록</div><div class="v"><span id="sCount">0</span><small> / <span id="sCap">0</span></small></div>
      <div class="progress" style="background:rgba(255,255,255,.2)"><i id="sBar" style="width:0"></i></div></div>
    <div class="stat"><div class="k">남은 수량</div><div class="v" id="sRemain">0</div></div>
    <div class="stat"><div class="k">티켓 교환</div><div class="v"><span id="sEx">0</span><small> 명</small></div></div>
    <div class="stat"><div class="k">와인 수령</div><div class="v"><span id="sGot">0</span><small> 명</small></div></div>
  </div>

  <div class="gstat" id="gstat"></div>

  <div class="grid">
    <div class="panel">
      <div class="toolbar">
        <input type="search" id="q" placeholder="등록번호 · 이름 · 연락처 검색">
        <select id="gfilter"><option value="">전체 학년</option></select>
        <div class="seg" id="filter">
          <button data-f="all" class="on">전체</button><button data-f="wait">교환 전</button><button data-f="ex">교환</button><button data-f="got">수령</button>
        </div>
      </div>
      <table>
        <thead><tr><th>번호</th><th>학년</th><th>이름</th><th>연락처</th><th class="reg">등록시각</th><th>티켓 교환</th><th>와인 수령</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty hidden" id="empty">등록자가 없습니다.</div>
    </div>

    <div class="side">
      <div class="panel">
        <h3>등록 설정</h3>
        <div class="field"><label for="openSw">사전 등록 받기</label>
          <label class="switch"><input type="checkbox" id="openSw"><span></span></label></div>
        <div style="font-size:14px;margin:4px 0 10px">학년별 선착순 정원</div>
        <div id="gEdit"></div>
        <div style="display:flex;gap:6px;justify-content:space-between;margin-top:10px">
          <button class="btn sm" id="gAdd">+ 학년 추가</button>
          <button class="btn sm dark" id="gSave">정원 저장</button>
        </div>
        <div class="upd" style="margin-top:8px">합계 <b id="gSum">0</b>명</div>
      </div>
      <div class="panel">
        <h3>등록 링크 · QR</h3>
        <p class="url" id="url"></p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm" id="copyUrl">링크 복사</button>
          <a class="btn sm" id="sheetLink" href="#" target="_blank" rel="noopener" style="text-decoration:none">구글 시트 열기</a>
        </div>
        <div id="qr"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let PW = '';
  let data = null, filter = 'all', gfilter = '', gDirty = false, pendingDel = null, timer = null;

  // Apps Script API 호출 (실패 응답은 예외로 바꿔서 기존 흐름 유지)
  const MAP = {
    adminLogin: pw => ['adminLogin', {pw}],
    adminGetData: pw => ['adminData', {pw}],
    adminSetSettings: (pw, settings) => ['adminSettings', {pw, settings}],
    adminSetStage: (pw, id, stage, value) => ['adminStage', {pw, id, stage, value}],
    adminDelete: (pw, id) => ['adminDelete', {pw, id}]
  };
  async function call(fn, ...args){
    const [action, body] = MAP[fn](...args);
    const r = await Drink.call(action, body, 1);
    if (fn === 'adminLogin') return r;
    if (!r || r.ok === false) throw new Error(r && r.code === 'AUTH' ? 'AUTH' : ((r && r.message) || '오류'));
    return r;
  }

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function authFail(e){ if (String(e && e.message || e).indexOf('AUTH') >= 0) { logout(); $('loginErr').textContent='다시 로그인해 주세요.'; return true; } return false; }

  // 로그인
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('loginBtn').disabled = true; $('loginErr').textContent = '';
    try {
      const r = await call('adminLogin', pw);
      if (r.ok) { PW = pw; try{sessionStorage.setItem('wd_pw', pw);}catch(e){} start(); }
      else $('loginErr').textContent = '비밀번호가 올바르지 않습니다.';
    } catch(err){ $('loginErr').textContent = '접속 오류가 발생했어요.'; }
    finally { $('loginBtn').disabled = false; }
  });
  function logout(){ PW=''; try{sessionStorage.removeItem('wd_pw');}catch(e){} clearInterval(timer); $('app').classList.add('hidden'); $('loginView').classList.remove('hidden'); }
  $('logoutBtn').onclick = logout;

  function start(){
    $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
    load(true); clearInterval(timer); timer = setInterval(() => load(false), 15000);
  }

  let qrDone = false;
  async function load(first){
    try {
      data = await call('adminGetData', PW);
      render(first);
    } catch(e){ if (!authFail(e)) toast('불러오기 실패: ' + (e.message || e)); }
  }

  function render(first){
    const rows = data.rows, got = rows.filter(r => r.received).length, ex = rows.filter(r => r.exchanged).length;
    $('title').textContent = data.title || 'Dégustation';
    $('upd').textContent = '업데이트 ' + data.updated;
    $('sCount').textContent = rows.length; $('sCap').textContent = data.capacity;
    $('sRemain').textContent = data.grades.reduce((n, g) => n + g.remaining, 0);
    $('sGot').textContent = got; $('sEx').textContent = ex;
    $('sBar').style.width = (data.capacity ? Math.min(100, rows.length / data.capacity * 100) : 100) + '%';
    $('openSw').checked = data.open;
    $('gstat').innerHTML = data.grades.map(g => `
      <div class="gs ${g.remaining <= 0 ? 'full' : ''}"><div class="top"><b>${esc(g.name)}</b><span>${g.count} / ${g.capacity}${g.remaining <= 0 ? ' · 마감' : ''}</span></div>
      <div class="progress"><i style="width:${g.capacity ? Math.min(100, g.count / g.capacity * 100) : 100}%"></i></div></div>`).join('');
    const opts = ['<option value="">전체 학년</option>'].concat(data.grades.map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`));
    [...new Set(data.rows.map(r => r.grade))].filter(n => !data.grades.some(g => g.name === n)).forEach(n => opts.push(`<option value="${esc(n)}">${esc(n)}</option>`));
    $('gfilter').innerHTML = opts.join(''); $('gfilter').value = gfilter;
    if (first || !gDirty) renderGradeEditor(data.grades);
    $('url').textContent = data.url;
    $('sheetLink').href = data.sheetUrl;
    if (!qrDone && window.QRCode && data.url) { new QRCode($('qr'), {text:data.url, width:360, height:360, correctLevel:QRCode.CorrectLevel.M}); qrDone = true; }
    renderTable();
  }

  function renderTable(){
    const q = $('q').value.trim().toLowerCase(), qd = q.replace(/\D/g,'');
    const list = data.rows.filter(r => {
      if (gfilter && r.grade !== gfilter) return false;
      if (filter === 'got' && !r.received) return false;
      if (filter === 'ex' && !r.exchanged) return false;
      if (filter === 'wait' && r.exchanged) return false;
      if (!q) return true;
      return r.name.toLowerCase().includes(q) || String(r.no) === q.replace(/^0+/,'') ||
             (qd.length >= 3 && r.phone.replace(/\D/g,'').includes(qd));
    }).sort((a,b) => a.no - b.no);
    $('empty').classList.toggle('hidden', list.length > 0);
    $('empty').textContent = data.rows.length ? '조건에 맞는 등록자가 없습니다.' : '아직 등록자가 없습니다.';
    $('tbody').innerHTML = list.map(r => `
      <tr class="${r.received ? 'got' : ''}">
        <td class="no">${String(r.no).padStart(3,'0')}</td>
        <td><span class="gtag">${esc(r.grade)}</span></td>
        <td>${esc(r.name)}</td>
        <td class="t">${esc(r.phone)}</td>
        <td class="t reg">${esc(r.time)}</td>
        <td><button class="chk ${r.exchanged ? 'on' : ''}" data-id="${esc(r.id)}" data-act="exchanged" title="${esc(r.exchangedAt)}">${r.exchanged ? '✓ 교환' : '교환 체크'}</button></td>
        <td><button class="chk ${r.received ? 'on' : ''}" data-id="${esc(r.id)}" data-act="received" title="${esc(r.receivedAt)}">${r.received ? '✓ 수령' : '수령 체크'}</button></td>
        <td style="text-align:right"><button class="del ${pendingDel === r.id ? 'confirm' : ''}" data-id="${esc(r.id)}" data-act="del">${pendingDel === r.id ? '삭제 확인' : '삭제'}</button></td>
      </tr>`).join('');
  }

  $('tbody').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.id, row = data.rows.find(r => r.id === id); if (!row) return;
    if (b.dataset.act === 'exchanged' || b.dataset.act === 'received') {
      const k = b.dataset.act, label = k === 'exchanged' ? '티켓 교환' : '와인 수령';
      const next = !row[k]; row[k] = next; renderTable();
      try { await call('adminSetStage', PW, id, k, next); toast(`${String(row.no).padStart(3,'0')} ${row.name} 님 ${label} ${next ? '완료' : '취소'}`); load(false); }
      catch(err){ row[k] = !next; renderTable(); if (!authFail(err)) toast('저장 실패'); }
    } else if (b.dataset.act === 'del') {
      if (pendingDel !== id) { pendingDel = id; renderTable(); setTimeout(() => { if (pendingDel === id) { pendingDel = null; renderTable(); } }, 3000); return; }
      pendingDel = null;
      try { await call('adminDelete', PW, id); toast(`${row.name} 님 등록 삭제`); load(false); }
      catch(err){ if (!authFail(err)) toast('삭제 실패'); }
    }
  });

  $('q').addEventListener('input', renderTable);
  $('gfilter').addEventListener('change', e => { gfilter = e.target.value; renderTable(); });

  function renderGradeEditor(grades){
    $('gEdit').innerHTML = grades.map(g => `<div class="grow">
      <input class="gn" value="${esc(g.name)}" maxlength="20" placeholder="학년 이름">
      <input class="gc" type="number" min="0" step="1" value="${g.capacity}"><span class="upd">명</span>
      <button class="x" title="삭제">×</button></div>`).join('');
    gDirty = false; updateSum();
  }
  function readGradeEditor(){
    return [...$('gEdit').querySelectorAll('.grow')].map(r => ({name: r.querySelector('.gn').value.trim(), capacity: r.querySelector('.gc').value}));
  }
  function updateSum(){ $('gSum').textContent = readGradeEditor().reduce((n, g) => n + (parseInt(g.capacity, 10) || 0), 0); }
  $('gEdit').addEventListener('input', () => { gDirty = true; updateSum(); });
  $('gEdit').addEventListener('click', e => { if (e.target.classList.contains('x')) { e.target.closest('.grow').remove(); gDirty = true; updateSum(); } });
  $('gAdd').onclick = () => {
    const cur = readGradeEditor(); cur.push({name:'', capacity:0});
    renderGradeEditor(cur); gDirty = true;
    const ins = $('gEdit').querySelectorAll('.gn'); ins[ins.length - 1].focus();
  };
  $('gSave').onclick = async () => {
    const grades = readGradeEditor();
    if (!grades.length) return toast('학년을 하나 이상 남겨 주세요');
    if (grades.some(g => !g.name)) return toast('학년 이름을 입력해 주세요');
    if (grades.some(g => isNaN(parseInt(g.capacity, 10)) || parseInt(g.capacity, 10) < 0)) return toast('정원을 숫자로 입력해 주세요');
    try { await call('adminSetSettings', PW, {grades}); gDirty = false; toast('학년별 정원을 저장했습니다'); load(true); }
    catch(err){ if (!authFail(err)) toast('저장 실패: ' + String(err.message || err).replace(/^Error:\s*/, '')); }
  };
  $('filter').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f; [...$('filter').children].forEach(x => x.classList.toggle('on', x === b)); renderTable();
  });
  $('refreshBtn').onclick = () => load(false);

  $('openSw').addEventListener('change', async e => {
    const v = e.target.checked;
    try { await call('adminSetSettings', PW, {open:v}); toast(v ? '사전 등록을 열었습니다' : '사전 등록을 닫았습니다'); load(false); }
    catch(err){ e.target.checked = !v; if (!authFail(err)) toast('저장 실패'); }
  });
  $('copyUrl').onclick = async () => {
    try { await navigator.clipboard.writeText(data.url); toast('링크를 복사했습니다'); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($('url')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('링크를 선택했어요. 복사해 주세요'); }
  };

  // 자동 로그인 (같은 탭)
  try { const saved = sessionStorage.getItem('wd_pw'); if (saved) { PW = saved; start(); } } catch(e){}
})();
</script>
</body>
</html>
